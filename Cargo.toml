[package]
name = "agent-pontifex-lambdas"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Provider-neutral cross-platform lambda runtime"
repository = "https://github.com/agent-pontifex/agent-pontifex-lambdas"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
lambda_runtime = "=1.3.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "health"
path = "src/bin/health.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
